# Banco de desenvolvimento local.
# Credenciais vêm de variáveis de ambiente: nenhuma senha fica no código.
#   DB_URL       (opcional) padrão: jdbc:postgresql://localhost:5432/reservas
#   DB_USER      (opcional) padrão: postgres
#   DB_PASSWORD  (obrigatória)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# update: cria e ajusta tabelas automaticamente. Aceitável em desenvolvimento; em produção usaríamos migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
