spring.application.name=reservas

# Perfil padrão. Para trocar, defina a variável de ambiente SPRING_PROFILES_ACTIVE (ex.: test).
spring.profiles.active=dev

# Desliga o Open Session In View: o acesso ao banco fica na camada de serviço,
# e os controllers só recebem dados já carregados ou ids (via DTOs).
spring.jpa.open-in-view=false
