# Sobe o banco PostgreSQL e a API juntos.
# Uso: copie .env.example para .env, defina DB_PASSWORD e rode: docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    # Só a máquina local acessa o banco (127.0.0.1), não a rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reservas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/reservas
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  reservas-db:
